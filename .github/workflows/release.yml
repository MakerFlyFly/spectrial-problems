name: Release task bank
on:
  push:
    tags: ['v*']
permissions: {contents: write}
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - run: pip install jsonschema==4.26.0 && python tools/validate.py
      - run: python -m unittest discover -s tests -v
      - name: Package immutable source and checksums
        run: |
          git archive --format=tar.gz --prefix=spectrial-problems/ HEAD > spectrial-problems.tar.gz
          sha256sum spectrial-problems.tar.gz > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" spectrial-problems.tar.gz SHA256SUMS --verify-tag --title "SpecTrial task bank $TAG" --notes-file RELEASE_NOTES.md
